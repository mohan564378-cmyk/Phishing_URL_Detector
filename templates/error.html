<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Invalid URL</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>

<div class="container">

    <div class="result-card error-card">

        <div class="error-icon">
            ⚠️
        </div>

        <h1 class="danger">
            Invalid URL
        </h1>

        <p>
            {{ message }}
        </p>

        <p>
            Please enter a valid URL beginning with
            <strong>http://</strong> or
            <strong>https://</strong>.
        </p>

        <a href="/">
            <button type="button">
                🔄 Try Again
            </button>
        </a>

    </div>

</div>

</body>

</html>
